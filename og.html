<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&family=Space+Grotesk:wght@500;700&display=block" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
      background: #FAF7F2;
      color: #1A1A1A;
      font-family: 'Space Grotesk', system-ui, sans-serif;
      padding: 80px 90px 60px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .mark {
      font-weight: 700;
      font-size: 220px;
      line-height: 0.9;
      letter-spacing: -0.04em;
      display: flex;
      align-items: center;
    }
    .dot {
      width: 92px;
      height: 92px;
      background: #FF6B35;
      border-radius: 50%;
      margin: 0 18px;
      flex-shrink: 0;
    }
    .tag {
      font-weight: 500;
      font-size: 42px;
      line-height: 1.18;
      letter-spacing: -0.015em;
      max-width: 1020px;
    }
    .tag s {
      color: #4A4A4A;
      text-decoration-thickness: 2.5px;
    }
    .tag .accent { color: #FF6B35; }
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      font-family: 'JetBrains Mono', 'SFMono-Regular', Menlo, monospace;
      font-size: 22px;
      color: #8A857C;
    }
  </style>
</head>
<body>
  <div class="mark">club<span class="dot"></span>code</div>
  <p class="tag">um lugar para encontrar outros <s>nerds</s> <span class="accent">vibe coders</span> igual você.</p>
  <div class="footer">
    <span>// presencial · temático · irado</span>
    <span>clubcode.com.br</span>
  </div>
</body>
</html>
